; Replacement firmware for the ESP8266 that was "Duco RF Gateway + Power Monitor v1.0".
; The Duco/CC1101 half is deliberately gone -- pairing never worked and the
; ventilation is handled another way now. What is left is the part that still
; earns its keep: the photodiode pulse counter on the electricity meter.
[env:esp12e]
platform  = espressif8266
board     = esp12e
framework = arduino
monitor_speed = 115200
upload_speed  = 460800
lib_deps  = knolleary/PubSubClient@^2.8
build_flags =
    -D MQTT_MAX_PACKET_SIZE=512

board_build.filesystem = littlefs

; ---------------------------------------------------------------------------
; ESP32-C3 SuperMini port (2026-10-27): the ESP-12E was removed from the meter.
; Sources live in src/c3/; src/main.cpp above stays the ESP8266 firmware.
; Toolchain: build with an isolated core dir so the other projects' platform
; pins (pioarduino, espressif32@7.x) cannot replace this one:
;   PLATFORMIO_CORE_DIR=C:\pio-pm pio run -e c3
; ---------------------------------------------------------------------------
[env:c3]
; Arduino 2.0.17 / IDF 4.4: smallest image with NimBLE; matches lightbar2mqtt.
platform  = espressif32@6.9.0
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; The USB link flaps on the first-flash PC (another device floods its USB bus):
; slow and retried is faster than fast and failed.
upload_speed  = 115200
board_build.filesystem  = littlefs
; 2 x 1.9 MB OTA slots + 128 KB LittleFS (config.json, /energy).
board_build.partitions  = min_spiffs.csv
build_unflags = -std=gnu++11
build_src_filter = -<*> +<c3/>
extra_scripts = post:c3_ota.py
lib_deps =
    knolleary/PubSubClient @ 2.8
    h2zero/NimBLE-Arduino  @ ^2.3.0
build_flags =
    -std=gnu++17
    -Isrc
    -D MQTT_MAX_PACKET_SIZE=512
    ; USB Serial/JTAG is the only console (no UART bridge on the SuperMini).
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; NimBLE trimmed to a passive observer (see src/c3/ble_presence.cpp).
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_LOG_LEVEL=5
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
    -DBLE_PUBLISH_FN_API
    -DBLE_NODE_NAME=\"kitchen\"

; Same image over WiFi. The espota password is read from data/config.json
; ("otaPassword", gitignored) by c3_ota.py; the target host defaults to
; powermon.local and can be overridden:  pio run -e c3_ota -t upload --upload-port <ip>
[env:c3_ota]
extends         = env:c3
upload_protocol = espota
upload_port     = powermon.local
