; Replacement firmware for the ESP8266 that was "Duco RF Gateway + Power Monitor v1.0".
; The Duco/CC1101 half is deliberately gone -- pairing never worked and the
; ventilation is handled another way now. What is left is the part that still
; earns its keep: the photodiode pulse counter on the electricity meter.
[env:esp12e]
platform  = espressif8266
board     = esp12e
framework = arduino
monitor_speed = 115200
upload_speed  = 460800
lib_deps  = knolleary/PubSubClient@^2.8
build_flags =
    -D MQTT_MAX_PACKET_SIZE=512

board_build.filesystem = littlefs
